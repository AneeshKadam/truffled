<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <iframe
        id="gameFrame"
        allowfullscreen
        allow="autoplay; fullscreen; gamepad; pointer-lock"
    ></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gameUrl = params.get("url");

        const iframe = document.getElementById("gameFrame");

        if (gameUrl) {
            iframe.src = gameUrl;
        } else {
            document.body.innerHTML = `
                <h1 style="color:white;text-align:center;">
                    No game specified.
                </h1>
            `;
        }
    </script>

</body>
</html>
