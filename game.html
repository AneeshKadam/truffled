<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading game...</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
#status{display:flex;align-items:center;justify-content:center;height:100%;font-size:18px}
#back{position:fixed;z-index:2147483647;top:12px;left:12px;border:0;border-radius:10px;padding:9px 14px;background:rgba(0,0,0,.72);color:#fff;cursor:pointer;font-weight:600;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div id="status">Loading game...</div>
<button id="back" type="button" onclick="history.back()">← Back</button>
<script>
(() => {
  const CDN_ROOT = "https://cdn.jsdelivr.net/gh/sussyboi01/truffledgames@main/";
  async function start() {
    const originalUrl = new URLSearchParams(location.search).get("url");
    if (!originalUrl) throw new Error("No game was selected.");

    const catalogResponse = await fetch(CDN_ROOT + "games.json", {cache:"no-store"});
    if (!catalogResponse.ok) throw new Error("Could not load the recovered game catalog.");
    const catalog = await catalogResponse.json();

    const wanted = originalUrl.replace(/^\.\//, "").replace(/^\//, "");
    const entry = catalog.find(item => {
      const source = String(item?.original?.url || "").replace(/^\.\//, "").replace(/^\//, "");
      return source === wanted;
    });
    if (!entry || !entry.game) throw new Error("This game is not available in the recovered game archive.");

    const gameResponse = await fetch(CDN_ROOT + entry.game.replace(/^\//, ""), {cache:"force-cache"});
    if (!gameResponse.ok) throw new Error("The recovered game file could not be loaded (" + gameResponse.status + ").");

    let html = await gameResponse.text();

    // Remove restrictive CSP meta tags from the recovered page.
    html = html.replace(/<meta[^>]+http-equiv=["']content-security-policy["'][^>]*>/gi, "");
    html = html.replace(/<meta[^>]+http-equiv=["']content-security-policy-report-only["'][^>]*>/gi, "");

    // Make relative assets resolve against the recovered repository.
    html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + CDN_ROOT + '">');

    // Convert root-relative asset references such as /games/... and /js/... to the CDN.
    html = html.replace(/(\b(?:src|href|poster|data|action)=["'])\/(?!\/)/gi, "$1" + CDN_ROOT);
    html = html.replace(/(\burl\(\s*["']?)\/(?!\/)/gi, "$1" + CDN_ROOT);
    html = html.replace(/(["'])\/(?!\/|\s)/g, "$1" + CDN_ROOT);

    document.title = entry.name || "Game";
    const safeTitle = document.title.replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const backButton = '<button id="truffled-back" type="button" style="position:fixed;z-index:2147483647;top:12px;left:12px;border:0;border-radius:10px;padding:9px 14px;background:rgba(0,0,0,.72);color:#fff;cursor:pointer;font:600 14px Arial,sans-serif;backdrop-filter:blur(8px)" onclick="history.back()">← Back</button>';

    html = html.replace(/<body([^>]*)>/i, "<body$1>" + backButton);
    html = html.replace(/<title>[^<]*<\/title>/i, "<title>" + safeTitle + "</title>");

    document.open();
    document.write(html);
    document.close();
  }

  start().catch(error => {
    console.error(error);
    document.getElementById("status").textContent = "Game could not be loaded: " + error.message;
  });
})();
</script>
</body>
</html>
