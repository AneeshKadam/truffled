<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <iframe id="gameFrame"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gameUrl = params.get("url");

        if (gameUrl) {
            document.getElementById("gameFrame").src = gameUrl;
        }
    </script>

</body>
</html>
