      <script>
         // Small amount of JS retained only for search/random behavior.
         const games = [...document.querySelectorAll('.game[data-name]')].filter(g => !['Game Suggestions','Random game'].includes(g.dataset.name));
         const searchInput = document.getElementById('searchInput');
         const searchCount = document.getElementById('searchCount');
         const randomGameLink = document.getElementById('randomGameLink');
         const allGames = games.length;

         function updateCount(count) {
            searchCount.textContent = count === allGames
               ? `Showing all ${allGames} games`
               : `Found ${count} ${count === 1 ? 'match' : 'matches'} in ${allGames} games`;
         }

         searchInput.addEventListener('input', () => {
            const filter = searchInput.value.toLowerCase().trim();
            let visible = 0;
            games.forEach(game => {
               const names = game.dataset.searchNames || game.dataset.name.toLowerCase();
               const show = !filter || names.includes(filter);
               game.style.display = show ? '' : 'none';
               if (show) visible++;
            });
            updateCount(visible);
         });

         randomGameLink.addEventListener('click', event => {
            event.preventDefault();
            if (!games.length) return;
            const random = games[Math.floor(Math.random() * games.length)];
            random.querySelector('a').click();
         });
      </script>
